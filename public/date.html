<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf9f1" />
    <title>a note</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" />
    <style>
      :root {
        --paper: #fbf9f1;
        --line: #cdd8e4;      /* faint blue rule */
        --margin: #dba7a7;    /* muted red margin */
        --ink: #2b3a57;       /* blue-black ballpoint */
        --ink-soft: #5b6479;
        --pencil: #8b8577;
        --hand: "Caveat", "Segoe Script", cursive;
        --row: 36px;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100svh; font-family: var(--hand); color: var(--ink);
        background: #ddd3bd; display: flex; justify-content: center; overflow-x: hidden;
      }
      .sheet {
        position: relative; width: 100%; max-width: 460px; min-height: 100svh;
        padding: max(34px, env(safe-area-inset-top)) 30px max(34px, env(safe-area-inset-bottom)) 62px;
        background-color: var(--paper);
        background-image: linear-gradient(var(--margin), var(--margin));
        background-repeat: no-repeat; background-size: 1.5px 100%; background-position: 48px 0;
        box-shadow: 0 0 36px rgba(0,0,0,0.16);
      }
      .sheet::before {
        content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background-image: repeating-linear-gradient(to bottom,
          transparent 0, transparent calc(var(--row) - 1px),
          var(--line) calc(var(--row) - 1px), var(--line) var(--row));
        background-position: 0 48px; opacity: 0.85;
      }
      .holes { position: absolute; left: 18px; top: 0; bottom: 0; z-index: 1;
        display: flex; flex-direction: column; justify-content: space-around;
        padding: 70px 0; pointer-events: none; }
      .holes i { width: 14px; height: 14px; border-radius: 50%; background: #ddd3bd;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.25); }

      .content { position: relative; z-index: 2; }

      /* everything sits on the ruled lines, left-aligned like a real note */
      h1 { font-weight: 600; font-size: clamp(34px, 10vw, 46px); line-height: var(--row);
        margin: calc(var(--row) * 2) 0 0; letter-spacing: 0.3px; }
      .sub { font-size: 22px; line-height: var(--row); color: var(--ink-soft); margin: 0; }

      .buttons { position: relative; margin-top: var(--row);
        display: flex; align-items: baseline; gap: 22px; }
      .yes {
        font-family: var(--hand); font-weight: 600; font-size: 30px; color: var(--paper);
        background: var(--ink); border: none; padding: 4px 30px 6px;
        border-radius: 3px 12px 4px 14px / 12px 4px 12px 4px; cursor: pointer;
        transition: transform 0.12s ease; }
      .yes:active { transform: scale(0.97); }
      .no {
        font-family: var(--hand); font-size: 26px; color: var(--pencil);
        background: none; border: none; padding: 4px 6px; cursor: pointer; }
      .no.loose { position: fixed; z-index: 30; margin: 0;
        transition: left 0.5s cubic-bezier(.4,0,.2,1), top 0.5s cubic-bezier(.4,0,.2,1); }

      .reply { display: none; font-size: 26px; color: var(--ink-soft);
        line-height: var(--row); margin-top: var(--row); }
      .reply.show { display: block; }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="holes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="content">
        <section id="ask">
          <h1>Go on a date with me?</h1>
          <p class="sub">there's a decent coffee place involved.</p>
          <div class="buttons">
            <button class="yes" id="yes">yes</button>
            <button class="no" id="no">no</button>
          </div>
        </section>
        <p class="reply" id="reply"></p>
      </div>
    </div>

    <script>
      (function () {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var no = document.getElementById("no");
        var yes = document.getElementById("yes");
        var ask = document.getElementById("ask");
        var reply = document.getElementById("reply");

        function place() {
          var pad = 16, w = no.offsetWidth || 60, h = no.offsetHeight || 40;
          no.style.left = pad + Math.random() * Math.max(0, innerWidth - w - pad * 2) + "px";
          no.style.top = pad + Math.random() * Math.max(0, innerHeight - h - pad * 2) + "px";
        }
        function slip(e) {
          if (e) e.preventDefault();
          if (reduce) { land("no? the offer doesn't expire."); return; }
          if (!no.classList.contains("loose")) {
            var r = no.getBoundingClientRect();
            no.classList.add("loose");
            no.style.left = r.left + "px"; no.style.top = r.top + "px";
          }
          place();
        }
        no.addEventListener("mouseenter", slip);
        no.addEventListener("touchstart", slip, { passive: false });
        no.addEventListener("click", slip);

        function land(text) {
          ask.style.display = "none";
          reply.textContent = text;
          reply.classList.add("show");
        }
        yes.addEventListener("click", function () { land("good. i'll sort the details."); });
      })();
    </script>
  </body>
</html>
