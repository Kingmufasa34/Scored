<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>Will you go on a date with me?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" />
    <style>
      :root {
        --paper: #f4f1ea;
        --ink: #1c1a17;
        --mute: #6b665c;
        --type: "Courier Prime", "Courier New", monospace;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100svh;
        font-family: var(--type);
        color: var(--ink);
        background: var(--paper);
        display: flex; align-items: center; justify-content: center;
        overflow-x: hidden;
      }

      .wrap {
        width: 100%; max-width: 440px;
        padding: max(28px, env(safe-area-inset-top)) 28px max(28px, env(safe-area-inset-bottom));
        text-align: center;
      }

      h1 {
        font-weight: 700; font-size: clamp(22px, 6.5vw, 30px);
        line-height: 1.4; margin: 0; letter-spacing: 0.5px;
      }

      .note { margin: 22px 0 0; font-size: 15px; line-height: 1.6; color: var(--mute); }

      .buttons {
        position: relative; margin-top: 40px; min-height: 120px;
        display: flex; flex-direction: column; align-items: center; gap: 16px;
      }

      .btn {
        font-family: var(--type); font-weight: 700; font-size: 16px;
        padding: 12px 30px; cursor: pointer; background: var(--paper);
        border: 2px solid var(--ink); border-radius: 2px; color: var(--ink);
        transition: transform 0.15s ease;
      }
      .btn:active { transform: scale(0.97); }
      .btn-yes { background: var(--ink); color: var(--paper); }
      .btn-no.loose {
        position: fixed; z-index: 30; margin: 0;
        transition: left 0.4s ease, top 0.4s ease;
      }

      .yay { display: none; }
      .yay.show { display: block; }
      .replay {
        margin-top: 28px; background: none; border: none; cursor: pointer;
        font-family: var(--type); font-size: 14px; color: var(--mute);
        text-decoration: underline; text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section id="ask">
        <h1>Will you go on a<br />date with me?</h1>
        <p class="note">No pressure. There's snacks.</p>
        <div class="buttons" id="buttons">
          <button class="btn btn-yes" id="yesBtn">Yes</button>
          <button class="btn btn-no" id="noBtn">No</button>
        </div>
      </section>

      <section class="yay" id="yay" aria-live="polite">
        <h1>It's a date.</h1>
        <p class="note">See you soon.</p>
        <button class="replay" id="replay">ask me again</button>
      </section>
    </div>

    <script>
      (function () {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var noBtn = document.getElementById("noBtn");
        var yesBtn = document.getElementById("yesBtn");
        var timer = null;

        function placeRandom() {
          var pad = 14;
          var bw = noBtn.offsetWidth || 100, bh = noBtn.offsetHeight || 46;
          noBtn.style.left = pad + Math.random() * Math.max(0, window.innerWidth - bw - pad * 2) + "px";
          noBtn.style.top = pad + Math.random() * Math.max(0, window.innerHeight - bh - pad * 2) + "px";
        }
        function goLoose() {
          if (noBtn.classList.contains("loose")) return;
          var r = noBtn.getBoundingClientRect();
          noBtn.classList.add("loose");
          noBtn.style.left = r.left + "px";
          noBtn.style.top = r.top + "px";
        }
        function wander() {
          if (reduce || timer) return;
          goLoose(); placeRandom();
          var tick = function () { placeRandom(); timer = setTimeout(tick, 900 + Math.random() * 1100); };
          timer = setTimeout(tick, 700);
        }
        function stop() { clearTimeout(timer); timer = null; }

        setTimeout(wander, 1400);

        function flee(e) { if (e) e.preventDefault(); if (reduce) return; goLoose(); placeRandom(); }
        noBtn.addEventListener("mouseenter", flee);
        noBtn.addEventListener("touchstart", flee, { passive: false });
        noBtn.addEventListener("click", flee);

        yesBtn.addEventListener("click", function () {
          stop();
          document.getElementById("ask").style.display = "none";
          document.getElementById("yay").classList.add("show");
        });
        document.getElementById("replay").addEventListener("click", function () {
          document.getElementById("yay").classList.remove("show");
          document.getElementById("ask").style.display = "";
          noBtn.classList.remove("loose");
          noBtn.style.left = noBtn.style.top = "";
          setTimeout(wander, 1200);
        });
      })();
    </script>
  </body>
</html>
