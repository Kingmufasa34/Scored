<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="A little note" />
    <title>So... about that date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&display=swap" />
    <style>
      :root {
        --paper: #f7f5f0;
        --paper-2: #eeece7;
        --line: #d9dce0;
        --margin: #c9a8b8;
        --ink: #34363b;
        --ink-soft: #62666d;
        --accent: #7b4964;
        --pencil: #8a887f;
        --hand: "Caveat", "Segoe Script", cursive;
        --hand-2: "Patrick Hand", "Caveat", cursive;
        --row: 34px;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100svh; font-family: var(--hand-2); color: var(--ink);
        background: #ddd9d2; display: flex; align-items: stretch; justify-content: center;
        overflow-x: hidden;
      }

      /* ── Floating hearts ── */
      .hearts { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
      .hearts i { position: absolute; bottom: -30px; color: #e23b4e; opacity: 0;
        animation: floatUp linear forwards; }
      @keyframes floatUp {
        0% { transform: translateY(0) rotate(0); opacity: 0; }
        12% { opacity: 0.6; }
        85% { opacity: 0.6; }
        100% { transform: translateY(-118svh) rotate(24deg); opacity: 0; }
      }

      /* ── The sheet of lined paper ── */
      .sheet {
        position: relative; width: 100%; max-width: 480px; min-height: 100svh;
        padding: max(30px, env(safe-area-inset-top)) 26px max(30px, env(safe-area-inset-bottom)) 58px;
        background-color: var(--paper);
        background-image: linear-gradient(var(--margin), var(--margin));
        background-repeat: no-repeat; background-size: 1.5px 100%; background-position: 44px 0;
        box-shadow: 0 0 40px rgba(0,0,0,0.16);
      }
      .sheet::before {
        content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background-image: repeating-linear-gradient(to bottom,
          transparent 0, transparent calc(var(--row) - 1px),
          var(--line) calc(var(--row) - 1px), var(--line) var(--row));
        background-position: 0 44px; opacity: 0.7;
      }
      .holes { position: absolute; left: 15px; top: 0; bottom: 0; z-index: 1;
        display: flex; flex-direction: column; justify-content: space-around;
        padding: 60px 0; pointer-events: none; }
      .holes i { width: 14px; height: 14px; border-radius: 50%; background: #ddd9d2;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.28); }

      .content { position: relative; z-index: 2; text-align: center; }

      /* everything fades in like it's being written */
      .writein { opacity: 0; transform: translateY(6px);
        animation: writein 0.7s cubic-bezier(.2,.7,.2,1) forwards; }
      @keyframes writein { to { opacity: 1; transform: none; } }

      .mark { font-size: 26px; line-height: var(--row); color: var(--pencil); opacity: 0.5; }

      .kicker { font-family: var(--hand-2); font-size: 18px; color: var(--ink-soft);
        transform: rotate(-1.5deg); margin: 0; line-height: var(--row); }

      h1 {
        font-family: var(--hand); font-weight: 700;
        font-size: clamp(36px, 11vw, 50px);
        line-height: 1.14;   /* breathe: don't collide the two lines */
        margin: 10px 0 0; color: var(--ink); letter-spacing: 0.4px;
      }
      h1 .em { color: var(--accent);
        text-decoration: underline wavy var(--accent); text-underline-offset: 6px;
        text-decoration-thickness: 1.5px; }

      .note { font-family: var(--hand-2); font-size: 19px; color: var(--ink-soft);
        line-height: var(--row); margin: 26px auto 0; max-width: 26ch; }

      .ps { font-family: var(--hand-2); font-size: 15.5px; color: var(--pencil);
        line-height: 25px; margin: 26px auto 0; max-width: 30ch; transform: rotate(-0.6deg); }

      /* ── Buttons ── */
      .buttons { position: relative; margin-top: 24px; min-height: 120px;
        display: flex; flex-direction: column; align-items: center; gap: 15px; }
      .btn { font-family: var(--hand); font-weight: 700; cursor: pointer;
        transition: transform 0.18s cubic-bezier(.2,.9,.3,1.3), box-shadow 0.18s ease; }
      .btn:active { transform: scale(0.95); }
      .btn-yes {
        font-size: 26px; color: var(--paper); padding: 6px 34px;
        background: var(--ink); border: none;
        border-radius: 4px 14px 6px 16px / 16px 6px 14px 6px;
        box-shadow: 3px 3px 0 rgba(0,0,0,0.16); transform: rotate(-1.5deg); }
      .btn-yes:hover { box-shadow: 4px 4px 0 rgba(0,0,0,0.2); }
      .btn-no {
        font-size: 21px; color: var(--ink-soft); background: var(--paper-2);
        border: 2px solid var(--ink-soft);
        border-radius: 14px 5px 16px 6px / 6px 15px 5px 14px;
        padding: 4px 26px; transform: rotate(1deg); box-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
      .btn-no.loose { position: fixed; z-index: 30; margin: 0;
        transition: left 0.42s cubic-bezier(.34,1.4,.5,1), top 0.42s cubic-bezier(.34,1.4,.5,1), transform 0.2s ease; }

      /* ── Celebration ── */
      .yay { display: none; }
      .yay.show { display: block; animation: pop 0.5s cubic-bezier(.2,.9,.3,1.35); }
      @keyframes pop { 0% { transform: scale(.85) rotate(-2deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
      .replay { margin-top: 30px; background: none; border: none; cursor: pointer;
        font-family: var(--hand-2); font-size: 17px; color: var(--pencil);
        text-decoration: underline; text-underline-offset: 3px; }

      @media (prefers-reduced-motion: reduce) {
        .writein, .yay.show { animation: none; opacity: 1; transform: none; }
      }

      /* ── Envelope intro ──────────────────────────────────────────── */
      body.sealed .sheet, body.sealed .hearts { display: none; }
      .cover {
        position: fixed; inset: 0; z-index: 100; background: #ddd9d2;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        transition: opacity 0.5s ease; }
      .cover.gone { opacity: 0; pointer-events: none; }

      /* envelope = fixed 3:2 box; every part is absolutely placed inside it */
      .env { position: relative; width: min(82vw, 320px); aspect-ratio: 3 / 2;
        perspective: 1200px; cursor: pointer; }
      .env > * { position: absolute; }

      .env-back  { inset: 0; background: #d8c39a; border-radius: 9px;
        box-shadow: 0 18px 44px rgba(0,0,0,0.22); z-index: 0; }

      /* the letter hides inside, then rises straight up */
      .letter { left: 7%; right: 7%; top: 9%; height: 82%; z-index: 1;
        background: var(--paper); border-radius: 5px 5px 0 0;
        box-shadow: 0 3px 12px rgba(0,0,0,0.14);
        display: flex; align-items: flex-start; justify-content: center; padding-top: 15px;
        font-family: var(--hand); font-size: 22px; color: var(--ink-soft);
        transition: transform 0.75s cubic-bezier(.25,.8,.3,1) 0.35s; }

      /* front face fully covers the letter while sealed */
      .env-front { inset: 0; z-index: 3; background: #cbb488; border-radius: 9px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.15); }
      .env-name { bottom: 20%; left: 0; right: 0; text-align: center; z-index: 4;
        font-family: var(--hand); font-weight: 700; font-size: 30px; color: #4a3f2e; }

      /* top triangular flap, folds up and back */
      .env-flap { top: 0; left: 0; width: 100%; height: 62%; z-index: 5;
        background: #e0cba0; clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: top center; transition: transform 0.55s ease;
        filter: drop-shadow(0 2px 3px rgba(0,0,0,0.12)); }
      .seal { top: 40%; left: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; z-index: 6;
        background: #e23b4e; border-radius: 50%; color: #fff; font-size: 19px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 3px 8px rgba(0,0,0,0.28); transition: opacity 0.2s ease; }

      .cover.open .env-flap { transform: rotateX(-172deg); z-index: 0; }
      .cover.open .seal     { opacity: 0; }
      .cover.open .letter   { transform: translateY(-72%); z-index: 5; }

      .tap { font-family: var(--hand-2); font-size: 17px; color: var(--pencil);
        animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      .cover.open .tap { opacity: 0; transition: opacity 0.3s; }

      @media (prefers-reduced-motion: reduce) {
        .letter, .env-flap { transition: none; } .tap { animation: none; }
      }
    </style>
  </head>
  <body class="sealed">
    <div class="cover" id="cover">
      <div class="env" id="env" role="button" tabindex="0" aria-label="Open the letter">
        <div class="env-back"></div>
        <div class="letter">for you</div>
        <div class="env-front"></div>
        <div class="env-name">Jas</div>
        <div class="env-flap"></div>
        <div class="seal">♥</div>
      </div>
      <p class="tap">tap to open</p>
    </div>

    <div class="hearts" id="hearts" aria-hidden="true"></div>
    <div class="sheet">
      <div class="holes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

      <main class="content">
        <section id="ask">
          <div class="mark writein" style="animation-delay:0s">✎</div>
          <p class="kicker writein" style="animation-delay:.1s">Jas,</p>
          <h1 class="writein" style="animation-delay:.2s">I think we<br />should go on a <span class="em">date.</span></h1>

          <p class="note writein" style="animation-delay:.45s">
            Let me take you somewhere decent.
            <br /><br />
            That's the whole pitch.
          </p>

          <div class="buttons writein" id="buttons" style="animation-delay:.7s">
            <button class="btn btn-yes" id="yesBtn">Yeah, let’s do it</button>
            <button class="btn btn-no" id="noBtn">No</button>
          </div>
        </section>

        <section class="yay" id="yay" aria-live="polite">
          <div class="mark">✎</div>
          <h1>Good. It’s a <span class="em">date.</span></h1>
          <p class="note">I'll sort the details.<br /><br />See you soon.</p>
          <button class="replay" id="replay">ask me again ↺</button>
        </section>
      </main>
    </div>

    <script src="/api/notify-config"></script>
    <script>
      (function () {
        // ── Get pinged when she answers ─────────────────────────────
        // The ntfy topic comes from /api/notify-config at runtime (Vercel env
        // var NTFY_TOPIC), so nothing secret lives in git. Install the "ntfy"
        // app and subscribe to that same topic to receive the push.
        var NTFY_TOPIC = (window.__NOTIFY || {}).ntfy || "";
        function ping(message) {
          if (!NTFY_TOPIC) return;
          try {
            fetch("https://ntfy.sh/" + NTFY_TOPIC, { method: "POST", body: message, keepalive: true });
          } catch (e) {}
        }

        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var noBtn = document.getElementById("noBtn");
        var yesBtn = document.getElementById("yesBtn");
        var dodges = 0;
        var teases = ["No", "you sure?", "really?", "think again.", "you sure?"];

        /* ── Yes button swells every 0.3s ── */
        var yesScale = 1;
        var growTimer = null;
        function applyYes() { yesBtn.style.transform = "rotate(-1.5deg) scale(" + yesScale.toFixed(3) + ")"; }
        // Biggest scale that still fits on screen (offsetW/H ignore the transform).
        function maxYesScale() {
          var m = 20; // breathing room from the edges
          return Math.max(1, Math.min(
            (window.innerWidth - m) / yesBtn.offsetWidth,
            (window.innerHeight - m) / yesBtn.offsetHeight
          ));
        }
        function grow() {
          var cap = maxYesScale();
          yesScale = Math.min(yesScale + 0.06, cap);
          applyYes();
          if (yesScale >= cap) stopGrow();   // filled the screen, so stop
        }
        function startGrow() { if (!reduce && !growTimer) growTimer = setInterval(grow, 500); }
        function stopGrow() { clearInterval(growTimer); growTimer = null; }

        /* ── Hearts floating up ── */
        var GLYPHS = ["♥", "❤", "♡"];
        function spawnHeart() {
          var el = document.createElement("i");
          el.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
          el.style.left = Math.random() * 100 + "%";
          el.style.fontSize = (14 + Math.random() * 20) + "px";
          el.style.animationDuration = (6 + Math.random() * 6) + "s";
          var host = document.getElementById("hearts");
          host.appendChild(el);
          setTimeout(function () { el.remove(); }, 12000);
        }
        var heartsTimer = null;
        function startHearts() {
          if (reduce || heartsTimer) return;
          for (var k = 0; k < 6; k++) setTimeout(spawnHeart, k * 500);
          heartsTimer = setInterval(spawnHeart, 900);
        }

        /* ── Envelope: tap to open, then reveal the note ── */
        var cover = document.getElementById("cover");
        var env = document.getElementById("env");
        var opened = false;
        function openEnvelope() {
          if (opened) return; opened = true;
          cover.classList.add("open");
          var wait = reduce ? 0 : 1150;
          setTimeout(function () {
            document.body.classList.remove("sealed"); // show the note + hearts
            cover.classList.add("gone");
            setTimeout(function () { cover.style.display = "none"; }, 500);
            startGrow();
            startHearts();
          }, wait);
        }
        env.addEventListener("click", openEnvelope);
        env.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnvelope(); }
        });

        function placeRandom() {
          var pad = 14, w = noBtn.offsetWidth || 110, h = noBtn.offsetHeight || 48;
          noBtn.style.left = pad + Math.random() * Math.max(0, innerWidth - w - pad * 2) + "px";
          noBtn.style.top = pad + Math.random() * Math.max(0, innerHeight - h - pad * 2) + "px";
          noBtn.style.transform = "rotate(" + (Math.random() * 16 - 8).toFixed(1) + "deg)";
        }
        function goLoose() {
          if (noBtn.classList.contains("loose")) return;
          var r = noBtn.getBoundingClientRect();
          noBtn.classList.add("loose");
          noBtn.style.left = r.left + "px"; noBtn.style.top = r.top + "px";
        }
        function flee(e) {
          if (e) e.preventDefault();
          dodges++;
          noBtn.textContent = teases[Math.min(dodges, teases.length - 1)];
          // Chasing No hurries the Yes button along, too.
          yesScale = Math.min(yesScale + 0.12, maxYesScale()); applyYes();
          if (reduce) return;            // reachable for reduced-motion
          goLoose(); placeRandom();
        }
        // Only reacts to you; it doesn't wander off on its own.
        noBtn.addEventListener("mouseenter", flee);
        noBtn.addEventListener("touchstart", flee, { passive: false });
        noBtn.addEventListener("click", flee);

        yesBtn.addEventListener("click", function () {
          stopGrow();
          ping("Jas said YES 🎉");
          document.getElementById("ask").style.display = "none";
          document.getElementById("yay").classList.add("show");
        });
        document.getElementById("replay").addEventListener("click", function () {
          document.getElementById("yay").classList.remove("show");
          document.getElementById("ask").style.display = "";
          dodges = 0;
          yesScale = 1; applyYes();
          noBtn.textContent = "No";
          noBtn.classList.remove("loose");
          noBtn.style.left = noBtn.style.top = noBtn.style.transform = "";
          startGrow();
        });
      })();
    </script>
  </body>
</html>
