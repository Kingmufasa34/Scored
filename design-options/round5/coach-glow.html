<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{box-sizing:border-box}body{margin:0;width:390px;height:844px;overflow:hidden;background:#0a0d19;font-family:Inter;color:#eef0f6;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform,opacity}
#b1{width:340px;height:340px;left:-120px;top:-80px;background:#7b5cff}
#b2{width:300px;height:300px;right:-130px;top:120px;background:#ff7ab6}
#b3{width:380px;height:380px;left:10px;bottom:-190px;background:#2ec5ff}
.w{position:relative;height:100%;display:flex;flex-direction:column;padding:22px 18px 18px}
.top{display:flex;justify-content:space-between;align-items:center}.top .t{font-family:"DM Serif Display";font-size:30px}.top .m{font-size:12px;color:#9aa2b8;border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:7px 12px}
.state{margin-top:4px;font-size:12px;letter-spacing:.16em;color:#9aa2b8;height:16px}
.thread{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding-bottom:14px}
.msg{max-width:84%;padding:12px 16px;border-radius:22px;font-size:15px;line-height:1.5;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px)}
.me{align-self:flex-end;background:rgba(238,240,246,.92);color:#10152a;border:0;border-bottom-right-radius:6px}
.ai{border-bottom-left-radius:6px}.did{font-size:12px;color:#b6bccd;margin-top:8px}.did span{border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:3px 9px;margin-right:4px}
.comp{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px)}
.comp .ph{flex:1;color:#8089a0;font-size:15px}.wave{display:flex;gap:3px;align-items:center;height:28px}.wave i{width:3px;border-radius:3px;background:#eef0f6;height:4px}
.mic{width:44px;height:44px;border-radius:50%;background:#eef0f6;display:grid;place-items:center;color:#10152a;font-size:18px}
</style></head><body>
<div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
<div class="w"><div class="top"><div class="t">Coach</div><div class="m">Memory · 24</div></div><div class="state" id="state">LISTENING</div>
<div class="thread">
<div class="msg me">Push day went well. Bench 85 for 5 sets of 5, felt like RPE 9 by the end.</div>
<div class="msg ai" id="ai"><span id="txt"></span><div class="did" id="did" style="opacity:0"><span>✓ Logged push · 18 sets</span><span>✓ Saved to memory</span></div></div>
</div>
<div class="comp"><div class="ph">Talk or type…</div><div class="wave" id="wave"></div><div class="mic">●</div></div></div>
<script>
const full="Nice. That's a 2.5 kg jump on bench since last Friday. RPE 9 on the last set means 85 is your working weight for now. Triceps are cooked, so tomorrow go legs or an easy run.";
const wave=document.getElementById('wave');for(let i=0;i<14;i++)wave.appendChild(document.createElement('i'));
const bars=[...wave.children],b=[b1,b2,b3].map(id=>id),t0=performance.now();
function amp(t,speaking){ if(!speaking) return 0.15+0.08*Math.sin(t*0.8);
  // Slow swell: a breath every ~2.5 s with a gentle second wave on top.
  return 0.45+0.35*Math.sin(t*2.5)*0.5+0.35*Math.sin(t*1.1+1)*0.5+0.2;}
let sm=0.15;
function frame(now){const t=(now-t0)/1000,speaking=t>1.2&&t<9.5;
 sm+=(amp(t,speaking)-sm)*0.02; const a=Math.max(0,Math.min(1,sm));
 document.getElementById('state').textContent=speaking?'SPEAKING':(t<1.2?'THINKING':'LISTENING');
 const n=speaking?Math.min(full.length,Math.floor((t-1.2)*24)):(t>=9.5?full.length:0);
 document.getElementById('txt').textContent=full.slice(0,n);
 document.getElementById('did').style.opacity=t>9.8?1:0;
 [b1,b2,b3].forEach((el,i)=>{const ph=a*(1+0.15*Math.sin(t*0.7+i*2));el.style.opacity=0.28+0.55*ph;el.style.transform=`scale(${0.9+0.45*ph}) translate(${Math.sin(t*0.25+i)*14}px,${Math.cos(t*0.2+i)*14}px)`;});
 bars.forEach((el,i)=>{el.style.height=(4+(speaking?22*amp(t+i*0.07,true):3*Math.abs(Math.sin(t*2+i))))+'px'});
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
