name: Table read audio

# Voices a screenplay draft with Chatterbox (expressive open-source TTS) on
# GitHub's machines and commits the mixed MP3 + timing file next to the draft.
on:
  push:
    branches: [ccr-adb08150-sjiujb]
    paths:
      - "screenplays/**/drafts/*.fountain"
      - "screenplays/tools/table_read_audio.py"
      - "screenplays/tools/make_voices.py"
      - ".github/workflows/table-read-audio.yml"
  workflow_dispatch:
    inputs:
      script:
        description: "Path to the .fountain draft to voice"
        default: "screenplays/life-after-alice/ep01-contingency/drafts/draft-03.fountain"

permissions:
  contents: write

concurrency:
  group: table-read-audio
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SCRIPT: ${{ github.event.inputs.script || 'screenplays/life-after-alice/ep01-contingency/drafts/draft-03.fountain' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chatterbox and Kokoro (CPU)
        run: |
          pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts soundfile librosa
          pip show chatterbox-tts torch | grep -E '^(Name|Version)'
          # Kokoro gets its own environment so Chatterbox's pins can't downgrade it
          python -m venv /tmp/kvenv
          /tmp/kvenv/bin/pip install -q "kokoro-onnx>=0.5" soundfile
          /tmp/kvenv/bin/pip show kokoro-onnx | grep -E '^(Name|Version)'

      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-hf-v1

      - name: Make the cast's reference voices (Kokoro)
        run: |
          mkdir -p work && cd work
          curl -sSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          /tmp/kvenv/bin/python ../screenplays/tools/make_voices.py voices

      - name: Voice the script (Chatterbox)
        run: |
          OUT_DIR="$(dirname "$(dirname "$SCRIPT")")/audio"
          NAME="$(basename "$SCRIPT" .fountain)"
          mkdir -p "$OUT_DIR"
          python screenplays/tools/table_read_audio.py "$SCRIPT" "$OUT_DIR/$NAME" --refs work/voices --cache work/clips
          mkdir -p screenplays/tools/voices && cp work/voices/*.wav screenplays/tools/voices/
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Commit the audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR" screenplays/tools/voices
          git commit -m "Table read audio for $(basename "$SCRIPT")" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
