<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Zine Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" />
<style id="appcss">
  /* ================================================================
     Zine Studio — a visual mini-zine maker.
     Upload photos, drag & resize them and text on each page, then
     Save & Share a link people open and flip through. Print composes
     the 8 pages into a fold-and-cut sheet.
     Persistence: self-publishing Artifact when available, else local.
     ================================================================ */
  :root {
    color-scheme: light;
    --paper:#f4efe4; --paper-2:#ebe4d4; --paper-3:#e0d7c2;
    --ink:#1a1712; --ink-2:#5c5445; --line:#cdc2a9; --line-2:#b3a684;
    --pink:#ff3d92; --pink-2:#e42d7e; --orange:#ff6a2b; --blue:#1f6fd0; --yellow:#ffcf2e;
    --focus:#1f6fd0; --tap:48px;
    --disp:"Anton","Arial Narrow",Impact,sans-serif;
    --ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"Space Mono",ui-monospace,Menlo,monospace;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--paper); color:var(--ink); font:15px/1.5 var(--ui);
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
    background-image:radial-gradient(var(--paper-3) .5px,transparent .6px); background-size:4px 4px;
  }
  :focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  button { font:inherit; }

  .app { display:flex; flex-direction:column; height:100dvh; }

  /* ---- top bar ---- */
  header.bar { background:var(--paper); border-bottom:2px solid var(--ink); padding-top:env(safe-area-inset-top); flex:0 0 auto; }
  .bar-in { display:flex; align-items:center; gap:10px; padding:9px 12px; }
  .plate { width:30px; height:30px; flex:0 0 auto; background:var(--pink); transform:rotate(45deg); display:grid; place-items:center; box-shadow:2px 2px 0 var(--ink); }
  .plate span { transform:rotate(-45deg); font:400 14px/1 var(--disp); color:#fff; }
  .word { flex:1; min-width:0; line-height:1; }
  .word b { display:block; font:400 19px/.9 var(--disp); text-transform:uppercase; letter-spacing:.02em; }
  .word small { font:10px/1 var(--mono); color:var(--ink-2); letter-spacing:.1em; text-transform:uppercase; }
  .seg { display:flex; border:1.5px solid var(--ink); overflow:hidden; flex:0 0 auto; }
  .seg button { min-height:38px; padding:0 12px; border:0; background:transparent; color:var(--ink-2); font:700 11px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .reg { display:flex; height:5px; }
  .reg i { flex:1; } .reg .c1{background:var(--pink)} .reg .c2{background:var(--orange)} .reg .c3{background:var(--yellow)} .reg .c4{background:var(--blue)}

  .icon-btn { min-height:38px; min-width:38px; padding:0 10px; border:1.5px solid var(--ink); background:#fff; color:var(--ink); font:700 13px/1 var(--ui); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .icon-btn:hover { background:var(--paper-2); }
  .icon-btn.pink { background:var(--pink); color:#fff; box-shadow:2px 2px 0 var(--ink); }
  .icon-btn.pink:hover { background:var(--pink-2); }

  /* ---- workspace ---- */
  .work { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:14px; position:relative; background:radial-gradient(var(--paper-3) .5px,transparent .6px) 0 0/5px 5px, var(--paper-2); overflow:hidden; }

  /* the page canvas (one zine page, portrait) */
  .canvas {
    position:relative; background:var(--page-bg,#fff); container-type:size;
    aspect-ratio:var(--aspect,0.647); height:min(62dvh,520px); max-width:calc(100vw - 28px);
    box-shadow:6px 6px 0 rgba(26,23,18,.18), 0 18px 46px rgba(0,0,0,.28); touch-action:none;
    background-image:var(--page-tex,none); background-size:var(--page-tex-size,auto);
  }
  .canvas .cnum { position:absolute; top:5px; left:6px; z-index:1; font:700 9px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--page-ink,#111); opacity:.4; pointer-events:none; }
  .canvas .crole { position:absolute; bottom:5px; right:6px; z-index:1; font:9px/1 var(--mono); text-transform:uppercase; color:var(--page-ink,#111); opacity:.35; pointer-events:none; }

  .layer { position:absolute; user-select:none; }
  .layer img { display:block; width:100%; height:100%; object-fit:cover; pointer-events:none; }
  .layer .txt { width:100%; font-family:var(--lf,var(--disp)); font-weight:800; line-height:1.02; color:var(--lc,#111); text-align:var(--la,left); word-break:break-word; white-space:pre-wrap; outline:none; }
  .canvas.edit .layer { cursor:grab; }
  .canvas.edit .layer.sel { outline:2px solid var(--pink); outline-offset:1px; }
  .layer .handle { position:absolute; right:-13px; bottom:-13px; width:26px; height:26px; border-radius:50%; background:var(--pink); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.4); display:none; cursor:nwse-resize; touch-action:none; z-index:5; }
  .canvas.edit .layer.sel .handle { display:block; }
  .layer.editing { cursor:text; }
  .layer.editing .txt { outline:2px dashed var(--blue); outline-offset:2px; }

  /* add-first-photo hint */
  .empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--ink-2); text-align:center; padding:20px; pointer-events:none; }
  .empty .big { font:400 22px/1 var(--disp); color:var(--ink); text-transform:uppercase; }
  .empty .small { font:12px/1.5 var(--mono); }

  /* ---- editor toolbars ---- */
  .add-bar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .layer-bar {
    position:absolute; left:0; right:0; bottom:0; z-index:20; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--paper); border-top:2px solid var(--ink);
    transform:translateY(110%); transition:transform .18s ease;
  }
  .layer-bar.show { transform:translateY(0); }
  .layer-bar label.swatch { display:inline-flex; }
  .layer-bar input[type=color] { width:38px; height:38px; border:1.5px solid var(--ink); background:#fff; padding:2px; cursor:pointer; }

  /* page strip */
  .pages { display:flex; gap:6px; align-items:center; }
  .pages .pg { width:30px; height:40px; border:1.5px solid var(--line-2); background:#fff; color:var(--ink-2); font:700 12px/1 var(--mono); cursor:pointer; display:grid; place-items:center; padding:0; }
  .pages .pg[aria-current="true"] { border-color:var(--pink); box-shadow:0 0 0 2px var(--pink) inset; color:var(--ink); }
  .pages .arrow { min-width:38px; min-height:40px; border:1.5px solid var(--ink); background:#fff; font-size:18px; cursor:pointer; }

  /* ---- reader ---- */
  .reader { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:var(--paper-2); z-index:15; }
  .reader.show { display:flex; }
  .reader .stagep { position:relative; touch-action:pan-y; perspective:1500px; }
  .reader #readerCanvas { transform-style:preserve-3d; will-change:transform,opacity; backface-visibility:hidden; }
  .reader .rnav { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:64px; border:0; background:rgba(26,23,18,.72); color:#fff; font-size:26px; cursor:pointer; z-index:3; }
  .reader .rnav.prev { left:-8px; } .reader .rnav.next { right:-8px; }
  .reader .rcount { font:700 12px/1 var(--mono); letter-spacing:.1em; color:var(--ink); text-transform:uppercase; }
  .reader .dots { display:flex; gap:7px; }
  .reader .dot { width:9px; height:9px; border-radius:50%; background:var(--line-2); border:0; padding:0; cursor:pointer; }
  .reader .dot[aria-current="true"] { background:var(--pink); }

  /* ---- toast + modal ---- */
  .toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:12px 18px; font:600 13px/1.3 var(--ui); z-index:100; opacity:0; transition:.22s; max-width:88vw; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .sheet-modal { position:fixed; inset:0; background:rgba(26,23,18,.55); display:none; align-items:center; justify-content:center; z-index:90; padding:18px; }
  .sheet-modal.show { display:flex; }
  .card { background:var(--paper); border:2px solid var(--ink); box-shadow:8px 8px 0 rgba(26,23,18,.35); max-width:440px; width:100%; padding:22px; }
  .card h3 { margin:0 0 8px; font:400 24px/1 var(--disp); text-transform:uppercase; }
  .card p { margin:0 0 12px; font:14px/1.5 var(--ui); color:var(--ink-2); }
  .card .link { font:12px/1.4 var(--mono); background:#fff; border:1.5px solid var(--line-2); padding:10px; word-break:break-all; margin-bottom:12px; }
  .card .row { display:flex; gap:8px; } .card .row > * { flex:1; }

  .hidden-print { display:none; }

  /* ---- print imposition ---- */
  @media print {
    header.bar, .add-bar, .layer-bar, .pages, .reader, .toast, .sheet-modal, .work .canvas, .empty { display:none !important; }
    .app, .work { display:block; height:auto; padding:0; background:#fff; }
    html, body { background:#fff; background-image:none; }
    .hidden-print { display:block; }
    #printSheet { position:relative; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(2,1fr); }
    .pp { position:relative; overflow:hidden; container-type:size; background:var(--pp-bg,#fff); }
    .pp.flip { transform:rotate(180deg); }
    .pp .layer { position:absolute; } .pp .layer img { width:100%; height:100%; object-fit:cover; }
    .pp .layer .txt { width:100%; }
    .pp .cut { position:absolute; }
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<!-- The whole app UI lives in this template; boot clones it into #root.
     Self-publish re-embeds this template verbatim, so it reproduces. -->
<template id="app-shell">
  <div class="app">
    <header class="bar">
      <div class="bar-in">
        <div class="plate" aria-hidden="true"><span>Z</span></div>
        <div class="word"><b>Zine Studio</b><small>make · flip · share</small></div>
        <div class="seg" role="group" aria-label="Mode">
          <button id="mEdit" aria-pressed="true">Edit</button>
          <button id="mRead" aria-pressed="false">Read</button>
        </div>
        <button class="icon-btn" id="printBtn" title="Print fold sheet">🖨</button>
        <button class="icon-btn pink" id="shareBtn">Share</button>
      </div>
      <div class="reg" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div>
    </header>

    <main class="work" id="work">
      <!-- editor -->
      <div class="canvas edit" id="canvas" aria-label="Zine page — drag items to move, drag the pink handle to resize">
        <div class="empty" id="emptyHint">
          <div class="big">Page 1 · Cover</div>
          <div class="small">Tap ＋ Photo to add an image,<br>then drag it and pinch/handle to resize.</div>
        </div>
      </div>

      <div class="add-bar" id="addBar">
        <div class="pages" id="pages"></div>
      </div>
      <div class="add-bar" id="addBar2">
        <button class="icon-btn pink" id="addPhoto">＋ Photo</button>
        <button class="icon-btn" id="addText">＋ Text</button>
        <label class="icon-btn" title="Page colour">Page <input type="color" id="pageBg" value="#f4efe4" style="width:26px;height:26px;border:0;padding:0;margin-left:6px;background:none"></label>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>

      <!-- selected-layer action bar -->
      <div class="layer-bar" id="layerBar">
        <button class="icon-btn" id="lEdit">✎ Edit text</button>
        <label class="icon-btn swatch" id="lColorWrap">Colour<input type="color" id="lColor" value="#111111"></label>
        <button class="icon-btn" id="lFont">Font: Display</button>
        <button class="icon-btn" id="lDup">⧉ Copy</button>
        <button class="icon-btn" id="lFront">⤒ Front</button>
        <button class="icon-btn" id="lDel">🗑 Delete</button>
      </div>

      <!-- reader -->
      <div class="reader" id="reader">
        <div class="stagep" id="readerStage">
          <button class="rnav prev" id="rPrev" aria-label="Previous page">‹</button>
          <div class="canvas" id="readerCanvas" style="box-shadow:8px 8px 0 rgba(26,23,18,.2),0 22px 50px rgba(0,0,0,.32)"></div>
          <button class="rnav next" id="rNext" aria-label="Next page">›</button>
        </div>
        <div class="rcount" id="rCount">Page 1 / 8</div>
        <div class="dots" id="rDots"></div>
      </div>
    </main>
  </div>

  <div class="hidden-print"><div id="printSheet"></div></div>

  <div class="toast" id="toast"></div>
  <div class="sheet-modal" id="modal">
    <div class="card">
      <h3 id="modalTitle">Shared!</h3>
      <p id="modalBody"></p>
      <div class="link" id="modalLink" hidden></div>
      <div class="row">
        <button class="icon-btn" id="modalCopy" hidden>Copy link</button>
        <button class="icon-btn pink" id="modalClose">Done</button>
      </div>
    </div>
  </div>
</template>

<script id="appjs">
(() => {
  "use strict";

  const PAPER = {
    letter:{ wIn:11, hIn:8.5, css:"11in 8.5in" },
    a4:{ wMm:297, hMm:210, css:"297mm 210mm" },
  };
  // single page aspect = (sheetW/4) / (sheetH/2)
  const pageAspect = (p) => p==="a4" ? (297/4)/(210/2) : (11/4)/(8.5/2);
  const H = 1000; // logical page height (square units); W = H*aspect
  // print imposition: grid cell -> page number (+flip on top row)
  const CELLS = [ {p:5,f:1},{p:4,f:1},{p:3,f:1},{p:2,f:1}, {p:6,f:0},{p:7,f:0},{p:8,f:0},{p:1,f:0} ];
  const ROLE = { 1:"cover", 8:"back cover" };
  const FONTS = [ ["Display","var(--disp)"], ["Body","var(--ui)"], ["Mono","var(--mono)"] ];

  let claudeApi = null; // window.claude
  const el = (id) => document.getElementById(id);
  let uid = 0; const nid = () => "l" + (Date.now().toString(36)) + (uid++).toString(36);

  // ---------- state ----------
  function blankPage(i){ return { bg: i===0 ? "#ff3d92" : "#ffffff", ink:"#111111", layers:[] }; }
  const state = {
    v:1, paper:"letter",
    pages: Array.from({length:8}, (_,i)=>blankPage(i)),
  };
  let cur = 0;          // current page index (0..7) in editor
  let readerPage = 0;   // page index in reader
  let mode = "edit";    // 'edit' | 'read'
  let sel = null;       // selected layer id
  let editingText = false;

  function loadEmbedded(){
    const tag = el("zine-state");
    if (!tag) return false;
    try { const data = JSON.parse(tag.textContent||"{}"); if (data && Array.isArray(data.pages) && data.pages.length===8){ Object.assign(state, data); return hasContent(); } } catch(_){}
    return false;
  }
  function loadLocal(){
    try { const r = localStorage.getItem("zine-studio-maker"); if(r){ const d=JSON.parse(r); if(d&&Array.isArray(d.pages)&&d.pages.length===8){ Object.assign(state,d); } } } catch(_){}
  }
  function saveLocal(){ try { localStorage.setItem("zine-studio-maker", JSON.stringify(state)); } catch(_){} }
  const hasContent = () => state.pages.some((p)=>p.layers.length>0);

  // ---------- geometry ----------
  const W = () => Math.round(H * pageAspect(state.paper));
  function applyPaperVars(canvas){ canvas.style.setProperty("--aspect", pageAspect(state.paper)); }

  // ---------- render one page into a container (interactive on editor canvas) ----------
  function renderPage(container, pageIdx, interactive){
    const page = state.pages[pageIdx];
    container.style.setProperty("--page-bg", page.bg);
    container.style.setProperty("--page-ink", page.ink||"#111");
    container.style.setProperty("--aspect", pageAspect(state.paper));
    // keep non-layer children (nums), rebuild layers
    [...container.querySelectorAll(".layer")].forEach((n)=>{ if(n.parentNode) n.parentNode.removeChild(n); });
    let num = container.querySelector(".cnum"); if(!num){ num=document.createElement("div"); num.className="cnum"; container.appendChild(num); }
    num.textContent = "Page " + (pageIdx+1);
    let role = container.querySelector(".crole");
    if (ROLE[pageIdx+1]){ if(!role){ role=document.createElement("div"); role.className="crole"; container.appendChild(role);} role.textContent=ROLE[pageIdx+1]; }
    else if (role) role.remove();

    const w = W();
    page.layers.forEach((L)=>{
      const d = document.createElement("div");
      d.className = "layer" + (interactive && L.id===sel ? " sel":"");
      d.dataset.id = L.id;
      d.style.left = (L.x/w*100)+"%"; d.style.top = (L.y/H*100)+"%"; d.style.width = (L.w/w*100)+"%";
      if (L.type==="image"){ d.style.height = (L.h/H*100)+"%"; d.innerHTML = `<img src="${imgSrc(L)}" alt="">`; }
      else { d.innerHTML = `<div class="txt">${escapeHtml(L.text||"")}</div>`;
        const t=d.firstChild; t.style.setProperty("--lc", L.color||"#111"); t.style.setProperty("--lf", L.font||"var(--disp)"); t.style.setProperty("--la", L.align||"left");
        t.style.fontSize = "calc(" + (L.fs/10) + " * 1cqh)"; }
      if (interactive){ const h=document.createElement("div"); h.className="handle"; h.dataset.resize="1"; d.appendChild(h); }
      container.appendChild(d);
    });
    const empt = container.querySelector(".empty"); if (empt) empt.style.display = page.layers.length? "none":"flex";
  }
  const imgSrc = (L) => L.src || "";

  // ---------- editor ----------
  const canvas = () => el("canvas");
  function renderEditor(){
    applyPaperVars(canvas());
    // update empty hint text for cover/others
    const eh = el("emptyHint"); if (eh){ eh.querySelector(".big").textContent = "Page "+(cur+1)+(ROLE[cur+1]?" · "+ROLE[cur+1]:""); }
    renderPage(canvas(), cur, true);
    el("pageBg").value = state.pages[cur].bg;
    renderPageStrip();
    updateLayerBar();
  }
  function renderPageStrip(){
    const strip = el("pages"); strip.innerHTML = "";
    const prev = document.createElement("button"); prev.className="arrow"; prev.textContent="‹"; prev.setAttribute("aria-label","Previous page"); prev.onclick=()=>gotoPage(cur-1); strip.appendChild(prev);
    for (let i=0;i<8;i++){ const b=document.createElement("button"); b.className="pg"; b.textContent=(i+1); if(i===cur)b.setAttribute("aria-current","true"); b.onclick=()=>gotoPage(i); strip.appendChild(b); }
    const next = document.createElement("button"); next.className="arrow"; next.textContent="›"; next.setAttribute("aria-label","Next page"); next.onclick=()=>gotoPage(cur+1); strip.appendChild(next);
  }
  function gotoPage(i){ i=(i+8)%8; commitTextEdit(); cur=i; sel=null; renderEditor(); }

  // ---------- layer ops ----------
  const curLayers = () => state.pages[cur].layers;
  const findLayer = (id) => curLayers().find((L)=>L.id===id);
  function addImageLayer(src, natW, natH){
    const w = W(); const aspect = natW/natH;
    let lw = w*0.55, lh = lw/aspect; if (lh > H*0.6){ lh=H*0.6; lw=lh*aspect; }
    const L = { id:nid(), type:"image", src, x:(w-lw)/2, y:(H-lh)/2, w:lw, h:lh, aspect };
    curLayers().push(L); sel=L.id; changed();
  }
  function addTextLayer(){
    const w=W(); const L={ id:nid(), type:"text", text:"Your text", x:w*0.1, y:H*0.12, w:w*0.8, fs:90, color:state.pages[cur].ink||"#111", font:"var(--disp)", align:"left" };
    curLayers().push(L); sel=L.id; changed(); setTimeout(()=>startTextEdit(L.id),30);
  }
  function deleteLayer(id){ const a=curLayers(); const i=a.findIndex((L)=>L.id===id); if(i>=0)a.splice(i,1); if(sel===id)sel=null; changed(); }
  function bringFront(id){ const a=curLayers(); const i=a.findIndex((L)=>L.id===id); if(i>=0){ const [L]=a.splice(i,1); a.push(L);} changed(); }
  function dupLayer(id){ const L=findLayer(id); if(!L)return; const c=JSON.parse(JSON.stringify(L)); c.id=nid(); c.x=Math.min(L.x+40, W()-30); c.y=Math.min(L.y+40, H-30); curLayers().push(c); sel=c.id; changed(); }

  function changed(){ saveLocal(); renderEditor(); }

  // ---------- pointer drag / resize ----------
  let drag = null;
  function onPointerDown(e){
    if (mode!=="edit" || editingText) return;
    const layerEl = e.target.closest(".layer"); const isHandle = e.target.dataset && e.target.dataset.resize;
    if (!layerEl){ if(!e.target.closest(".empty")){ sel=null; renderEditor(); } return; }
    const id = layerEl.dataset.id; sel=id; const L=findLayer(id); if(!L) return;
    const rect = canvas().getBoundingClientRect(); const sx=W()/rect.width, sy=H/rect.height;
    drag = { id, mode:isHandle?"resize":"move", startX:e.clientX, startY:e.clientY, ox:L.x, oy:L.y, ow:L.w, oh:L.h||0, ofs:L.fs||0, sx, sy };
    try{ (isHandle?e.target:layerEl).setPointerCapture(e.pointerId); }catch(_){}
    renderEditor();
    e.preventDefault();
  }
  function onPointerMove(e){
    if(!drag) return; const L=findLayer(drag.id); if(!L){ drag=null; return; }
    const dx=(e.clientX-drag.startX)*drag.sx, dy=(e.clientY-drag.startY)*drag.sy;
    const w=W();
    if (drag.mode==="move"){
      L.x = clamp(drag.ox+dx, -L.w*0.4, w-L.w*0.6);
      L.y = clamp(drag.oy+dy, -( (L.type==="image"?L.h:L.fs) )*0.4, H-( (L.type==="image"?L.h:L.fs) )*0.4);
    } else {
      if (L.type==="image"){ let nw=clamp(drag.ow+dx, w*0.08, w*1.2); L.w=nw; L.h=nw/(L.aspect||1); }
      else { L.fs = clamp(drag.ofs + dy, 20, 400); L.w = clamp(drag.ow+dx, w*0.15, w*1.05); }
    }
    // live update without full rebuild for smoothness
    const d = canvas().querySelector('.layer[data-id="'+drag.id+'"]'); if(d){ d.style.left=(L.x/w*100)+"%"; d.style.top=(L.y/H*100)+"%"; d.style.width=(L.w/w*100)+"%";
      if(L.type==="image") d.style.height=(L.h/H*100)+"%"; else { const t=d.querySelector(".txt"); if(t) t.style.fontSize="calc("+(L.fs/10)+" * 1cqh)"; } }
    e.preventDefault();
  }
  function onPointerUp(){ if(drag){ drag=null; saveLocal(); } }
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

  // ---------- text editing ----------
  function startTextEdit(id){
    const L=findLayer(id); if(!L||L.type!=="text") return; sel=id; editingText=true;
    renderEditor();
    const d=canvas().querySelector('.layer[data-id="'+id+'"]'); if(!d) return; d.classList.add("editing");
    const t=d.querySelector(".txt"); t.setAttribute("contenteditable","true"); t.focus();
    const rng=document.createRange(); rng.selectNodeContents(t); const s=getSelection(); s.removeAllRanges(); s.addRange(rng);
    // live-save on input; blur just cleans up this node (no re-render, avoids removal races)
    t.oninput = ()=>{ L.text = t.innerText; saveLocal(); };
    t.onblur = ()=>{ L.text = t.innerText.replace(/\n{3,}/g,"\n\n"); editingText=false; t.removeAttribute("contenteditable"); if(d.parentNode) d.classList.remove("editing"); saveLocal(); };
    updateLayerBar();
  }
  function commitTextEdit(){ if(!editingText) return; const t=canvas().querySelector(".layer.editing .txt"); if(t){ const L=findLayer(sel); if(L) L.text=t.innerText; t.blur(); } editingText=false; }

  function updateLayerBar(){
    const bar=el("layerBar"); const L=sel?findLayer(sel):null;
    if(!L){ bar.classList.remove("show"); return; }
    bar.classList.add("show");
    const isText = L.type==="text";
    el("lEdit").style.display = isText?"":"none";
    el("lColorWrap").style.display = isText?"":"none";
    el("lFont").style.display = isText?"":"none";
    if(isText){ el("lColor").value = L.color||"#111"; el("lFont").textContent = "Font: " + (FONTS.find((f)=>f[1]===L.font)||FONTS[0])[0]; }
  }

  // ---------- reader ----------
  function renderReaderContent(){
    const rc=el("readerCanvas"); rc.style.height="min(74dvh,560px)"; rc.style.maxWidth="calc(100vw - 40px)";
    renderPage(rc, readerPage, false);
  }
  function updateReaderMeta(){
    el("rCount").textContent = "Page " + (readerPage+1) + " / 8";
    const dots=el("rDots"); dots.innerHTML="";
    for(let i=0;i<8;i++){ const b=document.createElement("button"); b.className="dot"; if(i===readerPage)b.setAttribute("aria-current","true"); b.setAttribute("aria-label","Go to page "+(i+1)); b.onclick=()=>readerGoTo(i); dots.appendChild(b); }
  }
  function renderReader(){ renderReaderContent(); updateReaderMeta(); }

  let flipping=false;
  function readerGoTo(target){
    target=clamp(target,0,7);
    if(target===readerPage || flipping) return;
    const dir = target>readerPage ? 1 : -1;
    const rc=el("readerCanvas");
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce){ readerPage=target; renderReader(); return; }
    flipping=true;
    const outDeg = dir>0 ? -90 : 90;
    rc.style.transition="transform .19s ease-in, opacity .19s ease-in";
    rc.style.transform="rotateY("+outDeg+"deg)"; rc.style.opacity="0.35";
    setTimeout(()=>{
      readerPage=target; renderReaderContent(); updateReaderMeta();
      rc.style.transition="none";
      rc.style.transform="rotateY("+(-outDeg)+"deg)"; rc.style.opacity="0.35";
      void rc.offsetWidth;                       // reflow so the reverse angle takes hold
      rc.style.transition="transform .26s cubic-bezier(.2,.7,.3,1), opacity .26s";
      rc.style.transform="rotateY(0deg)"; rc.style.opacity="1";
      setTimeout(()=>{ flipping=false; rc.style.transition=""; rc.style.transform=""; }, 290);
    }, 190);
  }
  function readerGo(d){ readerGoTo(readerPage + d); }

  // ---------- modes ----------
  function setMode(m){
    mode=m; commitTextEdit(); sel=null;
    el("mEdit").setAttribute("aria-pressed", String(m==="edit"));
    el("mRead").setAttribute("aria-pressed", String(m==="read"));
    el("reader").classList.toggle("show", m==="read");
    el("canvas").style.display = m==="edit"?"":"none";
    el("addBar").style.display = m==="edit"?"":"none";
    el("addBar2").style.display = m==="edit"?"":"none";
    el("layerBar").classList.remove("show");
    if(m==="read"){ readerPage=0; renderReader(); } else renderEditor();
  }

  // ---------- print ----------
  function buildPrint(){
    const sheet=el("printSheet"); sheet.innerHTML="";
    const P=PAPER[state.paper];
    sheet.style.width = state.paper==="a4" ? "297mm":"11in";
    sheet.style.height = state.paper==="a4" ? "210mm":"8.5in";
    el("page-style-print").textContent = "@page { size:"+P.css+"; margin:0; }";
    const w=W();
    CELLS.forEach((cell)=>{
      const idx=cell.p-1, page=state.pages[idx];
      const pp=document.createElement("div"); pp.className="pp"+(cell.f?" flip":""); pp.style.setProperty("--pp-bg", page.bg);
      page.layers.forEach((L)=>{
        const d=document.createElement("div"); d.className="layer";
        d.style.left=(L.x/w*100)+"%"; d.style.top=(L.y/H*100)+"%"; d.style.width=(L.w/w*100)+"%";
        if(L.type==="image"){ d.style.height=(L.h/H*100)+"%"; d.innerHTML=`<img src="${imgSrc(L)}">`; }
        else { d.innerHTML=`<div class="txt">${escapeHtml(L.text||"")}</div>`; const t=d.firstChild; t.style.color=L.color||"#111"; t.style.fontFamily=L.font||"var(--disp)"; t.style.textAlign=L.align||"left"; t.style.fontWeight="800"; t.style.fontSize="calc("+(L.fs/10)+" * 1cqh)"; }
        pp.appendChild(d);
      });
      sheet.appendChild(pp);
    });
  }

  // ---------- persistence: self-publishing artifact ----------
  async function share(){
    commitTextEdit();
    if(!hasContent()){ toast("Add a photo or text first."); return; }
    if(!claudeApi || !claudeApi.use){ // repo / offline
      saveLocal(); openModal("Saved on this device","This copy is running as a plain file, so it can't create a shareable link. Open the published Zine Studio artifact to Save & Share.",null); return;
    }
    let artifact=null; try{ artifact=await claudeApi.use("artifact"); }catch(_){}
    if(!artifact){ saveLocal(); openModal("Can't publish here","This view can't publish a new version — you may be opening someone else's zine. Ask them to share the link.",null); return; }
    const btn=el("shareBtn"); const old=btn.textContent; btn.textContent="Saving…"; btn.disabled=true;
    try {
      await artifact.publish(buildPublishDoc());
      openModal("Saved & shared!","Everyone with this link now sees your zine and can flip through it in Read mode. Use the artifact's Share menu (top-right of this window) to send the link or make it public.", location.href);
    } catch(err){
      const code=(err&&err.code)||"";
      if(code==="conflict"){ toast("Someone else just saved — reloading to their version."); }
      else openModal("Couldn't publish","Saving the share version failed ("+(code||"unknown")+"). Your work is kept on this device; try Save & Share again.",null);
    } finally { btn.textContent=old; btn.disabled=false; }
  }
  function buildPublishDoc(){
    const css=el("appcss").textContent, js=el("appjs").textContent, shell=el("app-shell").outerHTML;
    const stateJson=JSON.stringify(state).replace(/</g,"\\u003c");
    return `<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zine Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style id="appcss">${css}</style></head>
<body><div id="root"></div>
${shell}
<script id="zine-state" type="application/json">${stateJson}<\/script>
<script id="appjs">${js}<\/script>
</body></html>`;
  }

  // ---------- image intake ----------
  function intakeFile(file){
    if(!file || !/^image\//.test(file.type)){ toast("That wasn't an image — try a JPG or PNG."); return; }
    const r=new FileReader();
    r.onerror=()=>toast("Couldn't read that file.");
    r.onload=()=>{ const img=new Image(); img.onload=()=>{ const {url,w,h}=downscale(img,1100); addImageLayer(url,w,h); }; img.onerror=()=>toast("That image couldn't load."); img.src=r.result; };
    r.readAsDataURL(file);
  }
  function downscale(img,max){
    let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
    if(w>max||h>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
    const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
    let url; try{ url=c.toDataURL("image/jpeg",0.78); }catch(_){ url=c.toDataURL(); }
    return { url, w, h };
  }

  // ---------- ui helpers ----------
  const escapeHtml=(s)=>String(s).replace(/[&<>]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/\n/g,"<br>");
  let toastT=null;
  function toast(msg){ const t=el("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }
  function openModal(title,body,link){ el("modalTitle").textContent=title; el("modalBody").textContent=body;
    const lk=el("modalLink"), cp=el("modalCopy");
    if(link){ lk.textContent=link; lk.hidden=false; cp.hidden=false; cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(link); cp.textContent="Copied ✓"; }catch(_){ cp.textContent="Copy failed"; } }; }
    else { lk.hidden=true; cp.hidden=true; }
    el("modal").classList.add("show"); }

  // ---------- boot ----------
  function boot(){
    el("root").innerHTML = el("app-shell").innerHTML;

    // wire top bar
    el("mEdit").onclick=()=>setMode("edit");
    el("mRead").onclick=()=>setMode("read");
    el("shareBtn").onclick=share;
    el("printBtn").onclick=()=>{ buildPrint(); setTimeout(()=>window.print(),60); };

    // add bar
    el("addPhoto").onclick=()=>el("fileInput").click();
    el("addText").onclick=addTextLayer;
    el("fileInput").onchange=(e)=>{ const f=e.target.files[0]; if(f) intakeFile(f); e.target.value=""; };
    el("pageBg").oninput=(e)=>{ state.pages[cur].bg=e.target.value; changed(); };

    // layer bar
    el("lEdit").onclick=()=>{ if(sel) startTextEdit(sel); };
    el("lColor").oninput=(e)=>{ const L=findLayer(sel); if(L){ L.color=e.target.value; changed(); } };
    el("lFont").onclick=()=>{ const L=findLayer(sel); if(!L)return; const i=FONTS.findIndex((f)=>f[1]===L.font); L.font=FONTS[(i+1)%FONTS.length][1]; changed(); };
    el("lDup").onclick=()=>{ if(sel) dupLayer(sel); };
    el("lFront").onclick=()=>{ if(sel) bringFront(sel); };
    el("lDel").onclick=()=>{ if(sel) deleteLayer(sel); };

    // canvas pointer + drag/drop/paste
    const cv=el("canvas");
    cv.addEventListener("pointerdown", onPointerDown);
    cv.addEventListener("pointermove", onPointerMove);
    cv.addEventListener("pointerup", onPointerUp);
    cv.addEventListener("pointercancel", onPointerUp);
    cv.addEventListener("dblclick",(e)=>{ const l=e.target.closest(".layer"); if(l){ const L=findLayer(l.dataset.id); if(L&&L.type==="text") startTextEdit(L.id); } });
    ["dragover","dragenter"].forEach((ev)=>cv.addEventListener(ev,(e)=>{ e.preventDefault(); }));
    cv.addEventListener("drop",(e)=>{ e.preventDefault(); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) intakeFile(f); });
    window.addEventListener("paste",(e)=>{ if(mode!=="edit")return; const items=(e.clipboardData||{}).items||[]; for(const it of items){ if(it.type&&it.type.indexOf("image")===0){ const f=it.getAsFile(); if(f){ intakeFile(f); break; } } } });

    // reader nav + swipe
    el("rPrev").onclick=()=>readerGo(-1);
    el("rNext").onclick=()=>readerGo(1);
    let sw=null; const rs=el("readerStage");
    rs.addEventListener("pointerdown",(e)=>{ sw={x:e.clientX,y:e.clientY}; });
    rs.addEventListener("pointerup",(e)=>{ if(!sw)return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)) readerGo(dx<0?1:-1); sw=null; });

    el("modalClose").onclick=()=>el("modal").classList.remove("show");
    el("modal").addEventListener("click",(e)=>{ if(e.target===el("modal")) el("modal").classList.remove("show"); });

    // @page style for print
    const ps=document.createElement("style"); ps.id="page-style-print"; ps.textContent="@page{size:11in 8.5in;margin:0;}"; document.head.appendChild(ps);

    window.addEventListener("resize",()=>{ if(mode==="edit") renderEditor(); else renderReader(); });

    // initial state: embedded (shared) > local draft
    const shared = loadEmbedded();
    if(!shared) loadLocal();
    // shared viewers land in Read mode; fresh makers in Edit
    if(shared){ setMode("read"); } else { setMode("edit"); }

    // connect claude (for Save & Share) — never blocks first paint
    if (window.claude && window.claude.use){ claudeApi = window.claude; }
  }

  if (document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
